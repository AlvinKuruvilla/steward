[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steward"
version = "0.1.0"
description = "A workbench for running an open-source repository"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Alvin Kuruvilla", email = "alvineasokuruvilla@gmail.com" },
]
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
steward = "steward.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.9",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4",
    "graphql-core>=3.2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 88
target-version = "py313"
# Generated by ariadne-codegen from the pinned schema. It is already formatted
# by ruff; linting it would mean editing a file that regenerates.
extend-exclude = ["src/steward/github_api"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib (prefer pathlib.Path)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["steward"]

[tool.mypy]
python_version = "3.13"
strict = true

# The generated models are checked like any other source. This one file is not
# generated from the schema -- ariadne-codegen copies it in verbatim -- so its
# two annotation gaps are theirs to fix, not ours to edit and lose on the next
# regeneration.
[[tool.mypy.overrides]]
module = "steward.github_api.async_base_client"
disallow_untyped_defs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

# Generated client for GitHub's GraphQL API. The schema is pinned in `schema/`
# and the operations in `queries/` are generated too -- see
# `scripts/gen_timeline_query.py`. Regenerate with:
#     uv run --with ariadne-codegen ariadne-codegen
# ariadne-codegen depends on ruff, so it is run as a tool rather than added to
# the dev group, where it would pin the formatter the rest of the project uses.
[tool.ariadne-codegen]
schema_path = "schema/github.graphql"
queries_path = "queries"
target_package_name = "github_api"
target_package_path = "src/steward"
client_name = "GitHubClient"
include_comments = "none"
# Only the inputs and enums the operations actually reach. Defaulting both to
# true generates the whole schema's, which is 8,000 lines nothing imports.
include_all_inputs = false
include_all_enums = false

# Custom scalars, which otherwise generate as `Any`. A timestamp arriving as a
# string the normalizer has to parse is the one thing the generated models exist
# to prevent.
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"

[tool.ariadne-codegen.scalars.GitObjectID]
type = "str"

[tool.ariadne-codegen.scalars.URI]
type = "str"

[tool.ariadne-codegen.scalars.HTML]
type = "str"

[tool.ariadne-codegen.scalars.GitTimestamp]
type = "datetime.datetime"
