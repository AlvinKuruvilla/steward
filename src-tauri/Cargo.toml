[package]
name = "steward-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1.53.1", features = ["sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
