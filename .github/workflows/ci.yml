name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

      # The database comes from compose rather than a service container: the
      # roles in db/init are what the migration tests are checking, and a
      # service container cannot run them.
      - run: docker compose up -d --wait db
        env:
          GITHUB_TOKEN: unused-by-the-database

      - run: uv run pytest
        env:
          STEWARD_ADMIN_DATABASE_URL: postgresql://steward_migrator:steward-dev@127.0.0.1:5432/steward?options=-c%20role%3Dsteward_owner

      - run: uv run pip-audit
