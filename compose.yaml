
# `docker compose up` is the whole install. Everything Steward needs to run
# against a repository is here; nothing is expected to be on the host but Docker
# and a GitHub token.

name: steward

services:
  db:
    image: postgres:18-alpine
    environment:
      # The superuser is used for bootstrap only. Application connections come in
      # as steward_engine, which has deliberately fewer privileges -- see
      # db/init/10-roles.sql and docs/design/0001-llm-boundary.md.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steward-dev}
      POSTGRES_DB: steward
    volumes:
      # postgres:18 stores data under a major-version subdirectory, so the
      # mount goes one level up. Mounting /var/lib/postgresql/data instead
      # makes the container refuse to start.
      - db-data:/var/lib/postgresql
      # Files here run once, in filename order, on an empty data directory. They
      # do not re-run against an existing volume, so they may only create things
      # that never change: roles, schemas, grants. Table definitions belong in
      # migrations, which run every boot and are versioned.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d steward"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Bound to loopback. Without the 127.0.0.1 prefix Docker publishes on
      # every interface, which would put Postgres on the network with the
      # default password from this file. Nothing in Steward needs the port
      # published at all; it is here so `psql` can reach it from the host.
      - "127.0.0.1:${STEWARD_DB_PORT:-5432}:5432"

  steward:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STEWARD_DATABASE_URL: postgresql://steward_engine:${STEWARD_ENGINE_PASSWORD:-steward-dev}@db:5432/steward
      # Migrations only. `role=steward_owner` is what makes the tables they
      # create owned by the role whose default privileges grant the engine
      # access; without it the engine can read nothing it just migrated.
      STEWARD_ADMIN_DATABASE_URL: postgresql://steward_migrator:${STEWARD_MIGRATOR_PASSWORD:-steward-dev}@db:5432/steward?options=-c%20role%3Dsteward_owner
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env or the environment}
    ports:
      # Loopback on the host. 0.0.0.0 below is the bind *inside* the container,
      # which is what makes the mapping work; the host side is what decides who
      # can reach it, and there is no authentication in front of this.
      - "127.0.0.1:${STEWARD_PORT:-8000}:8000"
    # The API and the built interface, from one process. `docker compose run
    # steward sync <owner>/<repo>` still works for a one-off.
    command: ["serve", "--host", "0.0.0.0"]

volumes:
  db-data:
